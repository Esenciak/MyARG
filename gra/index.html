<!doctype html>
<html lang="en-us">
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
		<title>Unity Web Player | Weteran_VerticalSlice</title>

		<style>
			html, body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background-color: #000000;
			}
			#unity-canvas {
				width: 100vw !important;
				height: 100vh !important;
				display: block;
			}

			#arg-loading-screen {
				position: fixed;
				top: 0;
				left: 0;
				width: 100vw;
				height: 100vh;
				background-color: #000000;
				color: #ff3333;
				font-family: 'Courier New', Courier, monospace;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				z-index: 9999;
				transition: opacity 0.5s ease-in-out;
				pointer-events: none;
			}
			.glitch-text {
				font-size: 24px;
				animation: blink 1s infinite;
			}
			@keyframes blink {
				50% { opacity: 0.3; }
			}
		</style>
	</head>
	<body style="text-align: center; padding: 0; border: 0; margin: 0">
		
		<div id="arg-loading-screen">
			<div class="glitch-text">>> INICJALIZACJA ŚRODOWISKA LIMINALNEGO...</div>
			<div style="font-size: 14px; margin-top: 20px; color: #550000;">(TRWA ŁĄCZENIE Z ARCHIWUM)</div>
		</div>

		<canvas
			id="unity-canvas"
			width="960"
			height="600"
			tabindex="-1"
			style="width: 960px; height: 600px; background: #000000"></canvas>

		<script>
			function OnUnityEvent(wynik) {
				if (wynik === "Zlapany") {
					alert("ZŁAPAŁ CIĘ. PĘTLA ZRESETOWANA.");
					window.location.href = "../reset.html";
				} else if (wynik === "Wygrana") {
					window.location.href = "../zwyciestwo.html";
				}
			}
		</script>
		<script src="PaczkaWebGL/MyARG.loader.js"></script>
		<script>
			if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
				var meta = document.createElement("meta");
				meta.name = "viewport";
				meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
				document.getElementsByTagName("head")[0].appendChild(meta);

				var canvas = document.querySelector("#unity-canvas");
				canvas.style.width = "100%";
				canvas.style.height = "100%";
				canvas.style.position = "fixed";

				document.body.style.textAlign = "left";
			}

			createUnityInstance(document.querySelector("#unity-canvas"), {
				arguments: [],
				dataUrl: "PaczkaWebGL/MyARG.data",
				frameworkUrl: "PaczkaWebGL/MyARG.framework.js",
				codeUrl: "PaczkaWebGL/MyARG.wasm",
				streamingAssetsUrl: "StreamingAssets",
				companyName: "Karol_Jablonski_Game",
				productName: "Weteran_VerticalSlice",
				productVersion: "0.1.2",
			})
				.then((unityInstance) => {
	
					var canvas = document.querySelector("#unity-canvas");
					canvas.addEventListener('click', function() {
						unityInstance.SetFullscreen(1);
					}, { once: true });

	
					setTimeout(() => {
						let loadingScreen = document.getElementById('arg-loading-screen');
						loadingScreen.style.opacity = '0';
						
						setTimeout(() => {
							loadingScreen.style.display = 'none';
						}, 1500); 
					}, 4000); 
				})
				.catch((message) => {
					alert(message);
				});
		</script>
	</body>
</html>
