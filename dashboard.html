<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>PANEL ADMINISTRATORA - TELEMETRIA LIVE</title>
    <style>
        body { background-color: #050505; color: #00ff41; font-family: 'Courier New', Courier, monospace; padding: 30px; }
        h1 { color: #ff3333; text-align: center; letter-spacing: 2px; }
        .container { max-width: 1000px; margin: 0 auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background-color: rgba(0, 20, 0, 0.5); }
        th, td { border: 1px solid #00ff41; padding: 12px; text-align: left; }
        th { background-color: #003300; color: white; font-size: 1.1rem; }
        tr:hover { background-color: rgba(0, 255, 65, 0.1); }
        .highlight { color: #ff8800; font-weight: bold; }
        .btn { background-color: #003300; color: #00ff41; border: 1px solid #00ff41; padding: 10px 20px; cursor: pointer; font-weight: bold; display: block; margin: 20px auto; font-family: inherit; }
        .btn:hover { background-color: #00ff41; color: black; }
    </style>
</head>
<body>
    <div class="container">
        <h1>> TRANSMISJA LIVE: LOGI SYSTEMU WETERAN <</h1>
        
        <button class="btn" onclick="zaladujLogiZChmury()">[ ODŚWIEŻ LOGI (GET) ]</button>

        <table>
            <thead>
                <tr>
                    <th style="width: 15%;">Czas</th>
                    <th style="width: 20%;">Strona</th>
                    <th style="width: 25%;">Zdarzenie</th>
                    <th style="width: 40%;">Wpisane hasło / Szczegóły</th>
                </tr>
            </thead>
            <tbody id="tabela-logow">
                <tr><td colspan='4' style='text-align:center; color:#aaa;'>Pobieranie danych z bazy...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = "https://TUTAJ_WKLEJ_TWÓJ_URL_API/logs"; // Ten sam URL co wyżej

        function zaladujLogiZChmury() {
            let tbody = document.getElementById("tabela-logow");
            
            // Wykonujemy żądanie GET do bazy w chmurze
            fetch(API_URL)
                .then(res => res.json())
                .then(logs => {
                    tbody.innerHTML = ""; // Czyścimy tabelę

                    if (!logs || logs.length === 0) {
                        tbody.innerHTML = "<tr><td colspan='4' style='text-align:center; color:#555;'>Brak zapisanych logów w bazie.</td></tr>";
                        return;
                    }

                    // Najnowsze akcje wyświetlamy na samej górze (odwracamy kolejność)
                    logs.reverse().forEach(log => {
                        let tr = document.createElement("tr");
                        
                        let tdCzas = document.createElement("td");
                        tdCzas.textContent = log.czas || "-";
                        tr.appendChild(tdCzas);

                        let tdStrona = document.createElement("td");
                        tdStrona.textContent = log.strona || "-";
                        tr.appendChild(tdStrona);

                        let tdAkcja = document.createElement("td");
                        tdAkcja.textContent = log.akcja || "-";
                        tr.appendChild(tdAkcja);

                        let tdDetale = document.createElement("td");
                        tdDetale.textContent = log.detale || "-";
                        
                        if (log.akcja === "WPISANO_HASŁO" || log.akcja === "PRÓBA_KOMENDY") {
                            tdDetale.classList.add("highlight");
                        }
                        tr.appendChild(tdDetale);

                        tbody.appendChild(tr);
                    });
                })
                .catch(err => {
                    console.error("Błąd pobierania danych:", err);
                    tbody.innerHTML = "<tr><td colspan='4' style='text-align:center; color:red;'>Błąd podczas połączenia z bazą telemetryczną.</td></tr>";
                });
        }

        // Automatyczne pobranie logów przy otwarciu panelu
        window.onload = zaladujLogiZChmury;
    </script>
</body>
</html>
