<!DOCKTYPE html>
<html>
<head>
	<title>Strona ARG</title>

	<style>
		body {
			background-color: black;
			color: #00ff00;
			text-align: center;
			margin-top: 20%;
		}

		.sekret {
			color: black;
			margin-top: 12px;
			user-select: all;
		}

		.sekretblur {
			color: #1c1919;
			margin-top: 12px;
			filter: blur(12px);
			text-align: left;
		}

		#random-word {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			z-index: -1;
			margin: 0;
			font-size: 7rem;
			color: #3a33335b;
			text-transform: uppercase;
			letter-spacing: 10px;
			white-space: nowrap;
			pointer-events: none;
			user-select: none;
		}

		.hiddenHint {
			opacity: 0;
			transition: opacity 0.5s;
			cursor: default;
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			width: 40%;
			margin: 0;
			background-color: black;
			color: #00ff00;
			font-weight: bold;
		}

			.hiddenHint:hover {
				opacity: 1;
			}

		.wrapper {
			position: relative;
			display: inline-block;
		}

		.inputWrapper {
			position: relative;
			display: inline-block;
			margin-top: 20px;
		}

		#haslo {
			background: rgba(0, 0, 0, 0.8);
			color: #00ff00;
			border: 1px solid #00ff00;
			padding: 10px;
			position: relative;
			z-index: 1;
		}
	</style>

	<script async src="https://www.googletagmanager.com/gtag/js?id=G-L14K2Y7ZGP"></script>
	<script>
		window.dataLayer = window.dataLayer || [];
		function gtag() { dataLayer.push(arguments); }
		gtag('js', new Date());

		gtag('config', 'G-L14K2Y7ZGP');
	</script>

</head>
	<body>
		<div class="wrapper">
			<h1>Wprowadz kod dostepu</h1>
			<p class="hiddenHint">Znajdz nazwe</p>
		</div>

		<p class="sekretblur">Tam gdzie rozszczepili pierwiastek</p>

		<div class="inputWrapper">
			<input type="text" id="haslo" />
			<button onclick="sprawdz()">ZATWIERDZ</button>
			<h1 id="random-word">Slowo</h1>
		</div>

		<p class="sekret">
			Koordynaty: 46.2341,6.0489 <br />Tam gdzie sie
			zaczelo
		</p>

		<script>
			console.log("%c[SYSTEM]: NIE AUTORYZOWANO DOSTĘPU DO KONSOLI.", "color: red; font-size: 16px; font-weight: bold; background: black; padding: 5px;");
			console.log("%cWidzę, że próbujesz oszukiwać. Szukasz tu wyjścia? Wyjścia nie ma.", "color: #770000; font-size: 14px; font-family: monospace;");

			function logTelemetry(eventType, details = "") {
    let currentPage = window.location.pathname.split('/').pop() || "index.html";
    
    let logData = {
        czas: new Date().toLocaleTimeString('pl-PL'),
        strona: currentPage,
        akcja: eventType,
        detale: details
    };

    const API_URL = "https://6a351b7ff957779fdb301cb3.mockapi.io/logs"; 
    
    fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(logData)
    }).catch(err => console.error("Błąd telemetrii chmury:", err));

    let logs = JSON.parse(localStorage.getItem("arg_telemetry")) || [];
    logs.push(logData);
    localStorage.setItem("arg_telemetry", JSON.stringify(logs));
}
			

			function sprawdz() {
    			let wpisaneHaslo = document.getElementById("haslo").value.toLowerCase().trim();

    			logTelemetry("WPISANO_HASŁO", wpisaneHaslo);

				if (btoa(wpisaneHaslo) === "Y2Vybg==") {
					gtag('event', 'haslo_odgadniete', { 'event_category': 'gra' });
					alert("Dostep przyznany. Projekt WETERAN zainicjowany.");
					window.location.href = "sektor-b";
				} else {
					let bledy = localStorage.getItem('licznik_bledow') || 0;
					bledy++;
					localStorage.setItem('licznik_bledow', bledy);
					alert(`Nieprawidlowy kod dostepu. Liczba nieudanych prób: ${bledy}`);
				}
			}

			const words = [
				"Pierwiastek",
				"Gdzie?",
				"Akronim",
				"Wodór",
				"Znajdź",
				"MAPA",
				"HASLO",
				"Ukryte",
				"ośrodek",
				"naukowo-badawczy",
				"Szwajcaria"
			];
			const wordElement = document.getElementById("random-word");

			function randTextOnScreen() {
				const randomIndex = Math.floor(Math.random() * words.length);
				wordElement.textContent = words[randomIndex];
			}
			setInterval(randTextOnScreen, 3000);
			window.onload = randTextOnScreen;
		</script>
	</body>
