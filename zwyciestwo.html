<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Koniec</title>
    <style>
        body {
            background-color: #efefef;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
        }
        .gratulacje {
            color: black;
            font-size: 2rem;
            letter-spacing: 5px;
            font-weight: bold;
        }
    </style>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L14K2Y7ZGP"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-L14K2Y7ZGP');
    </script>
</head>
<body>
    <p class="gratulacje">GRATULUJĘ UCIECZKI</p>
    <script>
        function logTelemetry(eventType, details = "") {
            let currentPage = window.location.pathname.split('/').pop() || "nieznany_plik.html";


            if (typeof gtag === 'function') {
                gtag('event', 'akcja_w_arg', {
                    'event_category': 'telemetria',
                    'typ_akcji': eventType,      
                    'strona': currentPage,       
                    'wpisane_detale': details    
                });
            }

            let logs = JSON.parse(localStorage.getItem("arg_telemetry")) || [];
            logs.push({
                czas: new Date().toLocaleTimeString('pl-PL'),
                strona: currentPage,
                akcja: eventType,
                detale: details
            });
            localStorage.setItem("arg_telemetry", JSON.stringify(logs));
        }


        window.addEventListener('load', () => { 
            logTelemetry("WEJŚCIE_NA_STRONĘ", "Załadowano widok"); 
        });
    </script>
</body>
</html>
