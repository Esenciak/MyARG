<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Koniec</title>
    <style>
        body {
            background-color: #efefef;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
        }
        .gratulacje {
            color: black;
            font-size: 2rem;
            letter-spacing: 5px;
            font-weight: bold;
        }
    </style>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L14K2Y7ZGP"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-L14K2Y7ZGP');
    </script>
</head>
<body>
    <p class="gratulacje">GRATULUJĘ UCIECZKI</p>

    <script>

        function logTelemetry(eventType, details = "") {
        let currentPage = window.location.pathname.split('/').pop() || "index.html";
        

        let playerId = localStorage.getItem("arg_player_id");
        if (!playerId) {
            playerId = "GRACZ_" + Math.random().toString(36).substr(2, 5).toUpperCase();
            localStorage.setItem("arg_player_id", playerId);
        }
        
        let logData = {
            gracz: playerId, 
            czas: new Date().toLocaleTimeString('pl-PL'),
            strona: currentPage,
            akcja: eventType,
            detale: details
        };

        const API_URL = "https://6a351b7ff957779fdb301cb3.mockapi.io/logs"; 
        
        fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(logData)
        }).catch(err => console.error("Błąd zapisu w chmurze:", err));


        let logs = JSON.parse(localStorage.getItem("arg_telemetry")) || [];
        logs.push(logData);
        localStorage.setItem("arg_telemetry", JSON.stringify(logs));
    }

    window.addEventListener('load', () => { 
        logTelemetry("WEJŚCIE_NA_STRONĘ", "Załadowano widok"); 
    });
    </script>
</body>
</html>
