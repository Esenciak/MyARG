<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>RESTART CYKLU</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .msg {
            font-size: 2rem;
            animation: fadeOut 4s forwards;
            text-align: center;
        }
        @keyframes fadeOut {
            0% { opacity: 1; color: white; }
            20% { color: red; transform: scale(1.1); }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }
        .msg2 {
            font-size: 1rem;
            animation:alternate-reverse 3s forwards;
            text-align: center;
        }
    </style>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L14K2Y7ZGP"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-L14K2Y7ZGP');
    </script>
</head>
<body>
    <div class="msg">
        <p>CYKL ZRESETOWANY.</p>
        <p>ROZPOCZYNANIE OD NOWA...</p>
        <p> </p>
        <p class = "msg2">INNI NIE MOGA ZACZYNAC OD NOWA</p>
    </div>
    <script>

        sessionStorage.clear();
        

        setTimeout(() => {
            window.location.href = "index.html";
        }, 4000);





function logTelemetry(eventType, details = "") {
        let currentPage = window.location.pathname.split('/').pop() || "index.html";
        

        let playerId = localStorage.getItem("arg_player_id");
        if (!playerId) {
            playerId = "GRACZ_" + Math.random().toString(36).substr(2, 5).toUpperCase();
            localStorage.setItem("arg_player_id", playerId);
        }
        
        let logData = {
            gracz: playerId, 
            czas: new Date().toLocaleTimeString('pl-PL'),
            strona: currentPage,
            akcja: eventType,
            detale: details
        };

        const API_URL = "https://6a351b7ff957779fdb301cb3.mockapi.io/logs"; 
        
        fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(logData)
        }).catch(err => console.error("Błąd zapisu w chmurze:", err));


        let logs = JSON.parse(localStorage.getItem("arg_telemetry")) || [];
        logs.push(logData);
        localStorage.setItem("arg_telemetry", JSON.stringify(logs));
    }

    window.addEventListener('load', () => { 
        logTelemetry("WEJŚCIE_NA_STRONĘ", "Załadowano widok"); 
    });
    </script>
</body>
</html>
