<!DOCKTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Sektor B - BŁĄD SYSTEMU</title>
    <style>
        body {
            background-color: #1a0000;
            color: #ff3333;
            font-family: 'Courier New', Courier, monospace;
            padding: 50px;
        }

        .glitch {
            font-size: 24px;
            animation: miganie 2s infinite;
        }
        @keyframes miganie {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }

            100% {
                opacity: 1;
            }
        }

        .console {
            border: 1px solid #ff3333;
            padding: 20px;
            margin-top: 20px;
        }


        .secret-hint {
            color: #1a0000;
            font-size: 12px;
            margin-top: 50px;
            user-select: all;
        }
    </style>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L14K2Y7ZGP"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-L14K2Y7ZGP');
    </script>
</head>
<body>

    <h1 class="glitch">OSTRZEŻENIE: ROZSZCZELNIENIE KADŁUBA</h1>

    <div class="console">
        <p>> Dziennik audio odzyskany...</p>
        <p>> "Nie słuchaj ich. Ten █░▒█░ to pułapka. Znajdź konsolę █░▒▓ w..." [NAGRANIE URWANE]</p>
        <br>
        <p>Wprowadź komendę ratunkową:</p>
        <input type="text" id="komenda" style="background: black; color: red; border: 1px solid red;">
        <button onclick="sprawdzKomende()" style="background: red; color: black; border: none;">WYKONAJ</button>
    </div>

    <p class="secret-hint">DEBUG: Ostatnia znana komenda ratunkowa to 'odzyskaj'. Zrzut pamięci wygenerowano pomyślnie.</p>

    <script>
        console.log("%c[SYSTEM]: NIE AUTORYZOWANO DOSTĘPU DO KONSOLI.", "color: red; font-size: 16px; font-weight: bold; background: black; padding: 5px;");
        console.log("%cWidzę, że próbujesz oszukiwać. Szukasz tu wyjścia? Wyjścia nie ma.", "color: #770000; font-size: 14px; font-family: monospace;");    

        function sprawdzKomende() {
            let wpisanaKomenda = document.getElementById("komenda").value.toLowerCase().trim();
            

            logTelemetry("PRÓBA_KOMENDY", wpisanaKomenda);

            let zakodowana = btoa(wpisanaKomenda);
            
            let trybOdzyskiwania = sessionStorage.getItem("recovery_mode") === "true";

            if (zakodowana === "b2R6eXNrYWo=") { 
                sessionStorage.setItem("recovery_mode", "true");
                alert("ODZYSKANO LOG: \nNAZWA: sys-dump-445 \nZAWARTOŚĆ: POWAŻNIE USZKODZONE\n\n[SYSTEM]: Zabezpieczenia zdjęte. Tryb awaryjny aktywny.");
                document.getElementById("komenda").value = "";
                return;
            }

            if (trybOdzyskiwania) {
                if (zakodowana === "bmFkcGlzeg==") { 
                    window.location.href = "brama.html"; 
                } else if (zakodowana === "cmVzZXQ=") { 
                    sessionStorage.removeItem("recovery_mode");
                    window.location.href = "reset.html"; 
                } else if (zakodowana === "c2VrdG9yIGI=") { 
                    alert("[SYSTEM]: Jesteś już w Sektorze B.");
                } else if (zakodowana === "bGltaW5hbG55") { 
                    document.body.style.cursor = "none"; 
                    setTimeout(() => {
                    window.location.href = "pustka.html"; 
                    }, 1500);
                } else if (zakodowana === "ZGlhZ25vemE=") { 
                    window.location.href = "diagnoza.html";
                } else {
                    alert("[SYSTEM]: Błąd. Nieznana komenda w trybie awaryjnym.");
                }
            } 
            else {
              
                if (zakodowana === "bmFkcGlzeg==" || zakodowana === "cmVzZXQ=" || zakodowana === "c2VrdG9yIGI=" || zakodowana === "ZGlhZ25vemE=") {
                    alert("[BŁĄD]: Odmowa dostępu. Wymagana inicjalizacja protokołu odzyskiwania.");
                } else if (zakodowana === "bGltaW5hbG55") { 
                    window.location.href = "pustka"; 
                } else {
                    alert("Nieznana komenda.");
                }
            }
        }




        function logTelemetry(eventType, details = "") {
        let currentPage = window.location.pathname.split('/').pop() || "index.html";
        
        let logData = {
            czas: new Date().toLocaleTimeString('pl-PL'),
            strona: currentPage,
            akcja: eventType,
            detale: details
        };

        const API_URL = "https://6a351b7ff957779fdb301cb3.mockapi.io/logs"; 
        
        fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(logData)
        }).catch(err => console.error("Błąd zapisu w chmurze:", err));

        let logs = JSON.parse(localStorage.getItem("arg_telemetry")) || [];
        logs.push(logData);
        localStorage.setItem("arg_telemetry", JSON.stringify(logs));
    }

    window.addEventListener('load', () => { 
        logTelemetry("WEJŚCIE_NA_STRONĘ", "Załadowano widok"); 
    });
        
    </script>

</body>
</html>
